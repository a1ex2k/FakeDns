name: Build and Release FakeDNS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Generate Version String
        id: get_version
        run: |
          # Format: YYYY.MM.DD
          VER=$(date +'%Y.%m.%d')
          echo "version=$VER" >> $GITHUB_OUTPUT

  build_and_package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # We use a matrix of all required architectures
        arch: [amd64, arm64, mipsel_24kc]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils # Required for 'ar' command in IPK creation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build and Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          chmod +x deployments/*.sh

          # 1. ALWAYS build the fakedns core binary for the current matrix arch
          ./deployments/build.sh $ARCH fakedns

          # 2. OpenWrt IPK Path
          # Requirement: IPK for arm64 and mipsel_24kc
          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "mipsel_24kc" ]; then
            echo "Packaging IPK for $ARCH..."
            ./deployments/package_ipk.sh $ARCH $VERSION
          fi

          # 3. Debian DEB Path (Combined)
          # Requirement: DEB for arm64 and amd64
          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "amd64" ]; then
            echo "Packaging DEB for $ARCH..."
            # For the combined DEB, we must also build the WebUI binary
            ./deployments/build.sh $ARCH fakedns-webui
            ./deployments/package_deb.sh $ARCH $VERSION
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  create_release:
    needs: [prepare, build_and_package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: all_packages/*