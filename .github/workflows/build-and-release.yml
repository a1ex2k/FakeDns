name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_tag: ${{ steps.get_version.outputs.is_tag }}
    steps:
      - name: Get Version from Tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER=${GITHUB_REF_NAME#v}
            IS_TAG="true"
          else
            VER=$(date +'%Y.%m.%d')
            IS_TAG="false"
          fi

          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Version: $VER, Is Tag: $IS_TAG"

  build_and_package:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [amd64, arm64, mipsel_24kc, filogic]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            g++ \
            g++-aarch64-linux-gnu \
            wget \
            xz-utils \
            zstd

      - name: Build and Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          OPENWRT_SDK_URL: ${{ vars.OPENWRT_SDK_URL }}
          OPENWRT_FILOGIC_SDK_URL: ${{ vars.OPENWRT_FILOGIC_SDK_URL }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          chmod +x deployments/*.sh

          unset CXX
          unset CXXFLAGS
          unset FAKEDNS_LDFLAGS

          if [ "$ARCH" == "arm64" ]; then
            export CXX=aarch64-linux-gnu-g++
          fi

          if [ "$ARCH" == "mipsel_24kc" ]; then
            DEFAULT_OPENWRT_SDK_URL="https://downloads.openwrt.org/releases/22.03.5/targets/ramips/mt7621/openwrt-sdk-22.03.5-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz"
            if [ -z "${OPENWRT_SDK_URL:-}" ]; then
              OPENWRT_SDK_URL="$DEFAULT_OPENWRT_SDK_URL"
              echo "::warning::OPENWRT_SDK_URL repository variable is not set."
              echo "::warning::Using default mt7621 SDK URL: $OPENWRT_SDK_URL"
            fi

            mkdir -p /tmp/openwrt-sdk
            wget -qO /tmp/openwrt-sdk.tar.xz "$OPENWRT_SDK_URL"
            tar -xf /tmp/openwrt-sdk.tar.xz -C /tmp/openwrt-sdk --strip-components=1

            TOOLCHAIN_BIN="$(find /tmp/openwrt-sdk/staging_dir -type d -path "*/toolchain-*/bin" | head -n1)"
            if [ -z "$TOOLCHAIN_BIN" ]; then
              echo "::error::OpenWrt SDK toolchain bin directory not found."
              exit 1
            fi

            export PATH="$TOOLCHAIN_BIN:$PATH"
            export STAGING_DIR="/tmp/openwrt-sdk/staging_dir"
            export CXX=mipsel-openwrt-linux-musl-g++
            export CXXFLAGS="-O2 -DNDEBUG -pipe -std=c++17 -pthread"
          fi

          if [ "$ARCH" == "filogic" ]; then
            DEFAULT_FILOGIC_SDK_URL="https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            if [ -z "${OPENWRT_FILOGIC_SDK_URL:-}" ]; then
              OPENWRT_FILOGIC_SDK_URL="$DEFAULT_FILOGIC_SDK_URL"
              echo "::warning::OPENWRT_FILOGIC_SDK_URL repository variable is not set."
              echo "::warning::Using default OpenWrt 25.12 Filogic SDK: $OPENWRT_FILOGIC_SDK_URL"
            fi

            SDK_DIR="/tmp/openwrt-filogic-sdk"
            mkdir -p "$SDK_DIR"
            wget -qO /tmp/openwrt-filogic-sdk.tar.zst "$OPENWRT_FILOGIC_SDK_URL"
            tar --zstd -xf /tmp/openwrt-filogic-sdk.tar.zst -C "$SDK_DIR" --strip-components=1

            TOOLCHAIN_BIN="$(find "$SDK_DIR/staging_dir" -type d -path "*/toolchain-*/bin" | head -n1)"
            if [ -z "$TOOLCHAIN_BIN" ]; then
              echo "::error::OpenWrt 25.12 Filogic SDK toolchain bin directory not found."
              exit 1
            fi

            CXX_BIN="$(find "$TOOLCHAIN_BIN" -maxdepth 1 -name '*-g++' | head -n1)"
            APK_TOOL="$SDK_DIR/staging_dir/host/bin/apk"
            if [ -z "$CXX_BIN" ] || [ ! -x "$APK_TOOL" ]; then
              echo "::error::Filogic cross-compiler or OpenWrt APK v3 tool not found in SDK."
              exit 1
            fi

            export PATH="$TOOLCHAIN_BIN:$PATH"
            export STAGING_DIR="$SDK_DIR/staging_dir"
            export CXX="$CXX_BIN"
            export CXXFLAGS="-O2 -DNDEBUG -pipe -std=c++17 -pthread -mcpu=cortex-a53"
          fi

          command -v "${CXX:-g++}"
          "${CXX:-g++}" --version

          ./deployments/build.sh "$ARCH" fakedns-lite

          if [ "$ARCH" == "filogic" ]; then
            ./deployments/package_core_apk.sh "$ARCH" "$VERSION" "$APK_TOOL"
          elif [ "$ARCH" == "arm64" ] || [ "$ARCH" == "mipsel_24kc" ]; then
            ./deployments/package_core_ipk.sh "$ARCH" "$VERSION"
          fi

          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "amd64" ]; then
            ./deployments/package_full_deb.sh "$ARCH" "$VERSION"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  create_release:
    needs: [prepare, build_and_package]
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: all_packages/*
