name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_tag: ${{ steps.get_version.outputs.is_tag }}
    steps:
      - name: Get Version from Tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER=${GITHUB_REF_NAME#v}
            IS_TAG="true"
          else
            VER=$(date +'%Y.%m.%d')
            IS_TAG="false"
          fi
          
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Version: $VER, Is Tag: $IS_TAG"

  build_and_package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, mipsel_24kc]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build and Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          chmod +x deployments/*.sh

          # 1. Build core binary
          ./deployments/build.sh $ARCH fakedns

          # 2. OpenWrt IPK
          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "mipsel_24kc" ]; then
            ./deployments/package_core_ipk.sh $ARCH $VERSION
          fi

          # 3. Debian DEB
          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "amd64" ]; then
            ./deployments/build.sh $ARCH fakedns-webui
            ./deployments/package_full_deb.sh $ARCH $VERSION
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  create_release:
    needs: [prepare, build_and_package]
    # THIS IS THE KEY LINE: Only run if the trigger was a tag
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: all_packages/*