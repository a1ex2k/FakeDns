<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FakeDNS WebUI</title>

    <link rel="stylesheet" href="styles.css" />
    <script defer src="scripts.js"></script>
</head>

<body>
<div class="wrap">
    <header class="header">
        <div class="title">
            <h1>FakeDNS WebUI</h1>
            <p class="subtitle">Управление списком доменов и перезагрузка службы)</p>
        </div>
    </header>

    <div id="msg" class="msg" hidden></div>

    <section class="card">
        <h2>Добавить домены</h2>
        <p class="hint">По одному домену на строку. Сервер сам нормализует/дедуплицирует.</p>

        <form class="add-form" action="/add" method="post">
            <label class="label" for="domainsInput">Domains</label>
            <textarea
                    id="domainsInput"
                    name="domains"
                    rows="6"
                    placeholder="example.com&#10;example2.com"
                    required
            ></textarea>

            <div class="row">
                <button class="btn primary" type="submit">Add</button>
                <button class="btn" type="button" id="clearBtn">Clear</button>
            </div>
        </form>
    </section>

    <section class="card">
        <div class="row between center">
            <div>
                <h2>Domains</h2>
                <p class="hint">Всего: <span id="count">0</span></p>
            </div>

            <div class="search">
                <input id="searchInput" type="search" placeholder="Search domain…" />
                <button class="btn" type="button" id="clearSearchBtn">Clear</button>
            </div>
        </div>

        <div id="loading" class="hint">Loading…</div>
        <div id="empty" class="empty" hidden>No domains yet</div>

        <ul id="list" class="list"></ul>
    </section>
</div>
</body>
</html>
