name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_tag: ${{ steps.get_version.outputs.is_tag }}
    steps:
      - name: Get Version from Tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER=${GITHUB_REF_NAME#v}
            IS_TAG="true"
          else
            VER=$(date +'%Y.%m.%d')
            IS_TAG="false"
          fi

          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Version: $VER, Is tag: $IS_TAG"

  build_and_package:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [amd64, arm64, mipsel_24kc, filogic]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            g++ \
            g++-aarch64-linux-gnu \
            wget \
            xz-utils \
            zstd

      - name: Build and Package
        if: matrix.arch != 'filogic'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          OPENWRT_SDK_URL: ${{ vars.OPENWRT_SDK_URL }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          chmod +x deployments/*.sh

          unset CXX CXXFLAGS FAKEDNS_LDFLAGS
          if [ "$ARCH" == "arm64" ]; then
            export CXX=aarch64-linux-gnu-g++
          fi
          if [ "$ARCH" == "mipsel_24kc" ]; then
            DEFAULT_OPENWRT_SDK_URL="https://downloads.openwrt.org/releases/22.03.5/targets/ramips/mt7621/openwrt-sdk-22.03.5-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz"
            if [ -z "${OPENWRT_SDK_URL:-}" ]; then
              OPENWRT_SDK_URL="$DEFAULT_OPENWRT_SDK_URL"
              echo "::warning::OPENWRT_SDK_URL is not set; using the default 22.03.5 SDK."
            fi

            mkdir -p /tmp/openwrt-sdk
            wget -qO /tmp/openwrt-sdk.tar.xz "$OPENWRT_SDK_URL"
            tar -xf /tmp/openwrt-sdk.tar.xz -C /tmp/openwrt-sdk --strip-components=1

            TOOLCHAIN_BIN="$(find /tmp/openwrt-sdk/staging_dir -type d -path "*/toolchain-*/bin" | head -n1)"
            test -n "$TOOLCHAIN_BIN"
            export PATH="$TOOLCHAIN_BIN:$PATH"
            export STAGING_DIR="/tmp/openwrt-sdk/staging_dir"
            export CXX=mipsel-openwrt-linux-musl-g++
            export CXXFLAGS="-O2 -DNDEBUG -pipe -std=c++17 -pthread"
          fi

          ./deployments/build.sh "$ARCH" fakedns-lite

          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "mipsel_24kc" ]; then
            ./deployments/package_core_ipk.sh "$ARCH" "$VERSION"
          fi

          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "amd64" ]; then
            ./deployments/package_full_deb.sh "$ARCH" "$VERSION"
          fi

      - name: Build OpenWrt 25.12 APK (MT7621)
        if: matrix.arch == 'mipsel_24kc'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euxo pipefail

          SDK_URL="https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621/openwrt-sdk-25.12.6-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          mkdir -p /tmp/openwrt-sdk-25.12
          wget -qO /tmp/openwrt-sdk-25.12.tar.zst "$SDK_URL"
          echo "e4e3f25962ddf3ed55207fed456ecd1d6e55f3482c976b3183a640df6ef0adf0  /tmp/openwrt-sdk-25.12.tar.zst" | sha256sum -c -
          tar --zstd -xf /tmp/openwrt-sdk-25.12.tar.zst -C /tmp/openwrt-sdk-25.12 --strip-components=1

          SDK_DIR=/tmp/openwrt-sdk-25.12
          HOST_PATH="$PATH"
          TOOLCHAIN_BIN="$(find "$SDK_DIR/staging_dir" -type d -path "*/toolchain-*/bin" | head -n1)"
          test -n "$TOOLCHAIN_BIN"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export STAGING_DIR="$SDK_DIR/staging_dir"
          export CXX=mipsel-openwrt-linux-musl-g++
          export CXXFLAGS="-O2 -DNDEBUG -pipe -std=c++17 -pthread"

          # Build against the 25.12 toolchain, not the older 22.03 toolchain.
          ./deployments/build.sh mipsel_24kc fakedns-lite

          # The binary is already cross-compiled. Run the SDK package build with
          # the native host compiler and tools, not the target compiler from PATH.
          export PATH="$HOST_PATH"
          unset CXX CXXFLAGS

          mkdir -p "$SDK_DIR/package/fakedns-lite/files"
          cp "bin/mipsel_24kc/fakedns-lite" "$SDK_DIR/package/fakedns-lite/files/fakedns-lite"
          cp deployments/fakedns-lite/Makefile "$SDK_DIR/package/fakedns-lite/Makefile"
          cp deployments/fakedns-lite/fakedns-lite.init "$SDK_DIR/package/fakedns-lite/files/"
          cp deployments/fakedns-lite/fakedns-lite.uciconf "$SDK_DIR/package/fakedns-lite/files/fakedns-lite.config"

          cd "$SDK_DIR"
          make package/fakedns-lite/compile V=s

          find bin/packages -type f -name "fakedns-lite_*.apk" -print -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'fakedns-lite_*.apk' -print -quit)"

      - name: "Build OpenWrt 25.12 APK (Filogic: MT7981/MT7986)"
        if: matrix.arch == 'filogic'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          chmod +x deployments/*.sh

          SDK_URL="https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          SDK_SHA256="1c04ac47bdfc361d6aab299eb520d570e368013dedcb8d29cf39dc7168ae642e"
          SDK_DIR=/tmp/openwrt-sdk-filogic-25.12
          mkdir -p "$SDK_DIR"
          wget -qO /tmp/openwrt-sdk-filogic-25.12.tar.zst "$SDK_URL"
          echo "$SDK_SHA256  /tmp/openwrt-sdk-filogic-25.12.tar.zst" | sha256sum -c -
          tar --zstd -xf /tmp/openwrt-sdk-filogic-25.12.tar.zst -C "$SDK_DIR" --strip-components=1

          HOST_PATH="$PATH"
          TOOLCHAIN_BIN="$(find "$SDK_DIR/staging_dir" -type d -path "*/toolchain-*/bin" | head -n1)"
          test -n "$TOOLCHAIN_BIN"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export STAGING_DIR="$SDK_DIR/staging_dir"
          export CXX=aarch64-openwrt-linux-musl-g++
          export CXXFLAGS="-O2 -DNDEBUG -pipe -std=c++17 -pthread"

          ./deployments/build.sh filogic fakedns-lite

          export PATH="$HOST_PATH"
          unset CXX CXXFLAGS

          mkdir -p "$SDK_DIR/package/fakedns-lite/files"
          cp bin/filogic/fakedns-lite "$SDK_DIR/package/fakedns-lite/files/fakedns-lite"
          cp deployments/fakedns-lite/Makefile "$SDK_DIR/package/fakedns-lite/Makefile"
          cp deployments/fakedns-lite/fakedns-lite.init "$SDK_DIR/package/fakedns-lite/files/"
          cp deployments/fakedns-lite/fakedns-lite.uciconf "$SDK_DIR/package/fakedns-lite/files/fakedns-lite.config"

          cd "$SDK_DIR"
          make package/fakedns-lite/compile V=s

          find bin/packages -type f -name "fakedns-lite_*.apk" -print -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'fakedns-lite_*.apk' -print -quit)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}${{ (matrix.arch == 'mipsel_24kc' || matrix.arch == 'filogic') && '-openwrt-25.12.6' || '' }}
          path: dist/*

  create_release:
    needs: [prepare, build_and_package]
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all_packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: all_packages/*
