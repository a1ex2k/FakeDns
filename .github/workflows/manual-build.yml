name: Manual Release (Simplified Version)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Generate yyyy.M.d.h.m Version
        id: get_version
        # %Y: Year, %-m: Month, %-d: Day, %-H: Hour (0-23), %-M: Minute
        # Result example: 2025.12.19.0.7 (for 12:07 AM)
        run: |
          VER=$(date +'%Y.%-m.%-d.%-H.%-M')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version set to: $VER"

  build_and_package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, mipsel_24kc]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Make scripts executable
        run: chmod +x deployments/*.sh

      - name: Build Binaries
        run: ./deployments/build.sh ${{ matrix.arch }}

      - name: Create Packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          ./deployments/package.sh fakedns ${{ matrix.arch }} $VERSION deb
          ./deployments/package.sh fakedns ${{ matrix.arch }} $VERSION ipk
          ./deployments/package.sh fakedns-webui ${{ matrix.arch }} $VERSION deb
          ./deployments/package.sh fakedns-webui ${{ matrix.arch }} $VERSION ipk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  create_release:
    needs: [prepare, build_and_package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: all_packages/*