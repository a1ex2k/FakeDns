name: Manual Release (Simplified Version)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Generate yyyy.M.d.h.m Version
        id: get_version
        run: |
          VER=$(date +'%Y.%-m.%-d')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version set to: $VER"

  build_and_package:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, mipsel_24kc]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils # Required for 'ar' command in .ipk creation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Make scripts executable
        run: chmod +x deployments/*.sh

      - name: Build Binaries
        run: ./deployments/build.sh ${{ matrix.arch }}

      - name: Create Packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          
          # 1. Build .ipk packages for ALL architectures (OpenWrt)
          ./deployments/package.sh fakedns $ARCH $VERSION ipk
          ./deployments/package.sh fakedns-webui $ARCH $VERSION ipk
          
          # 2. Build .deb packages ONLY for amd64 and arm64 (Standard Linux)
          if [ "$ARCH" != "mipsel_24kc" ]; then
            ./deployments/package.sh fakedns $ARCH $VERSION deb
            ./deployments/package.sh fakedns-webui $ARCH $VERSION deb
          else
            echo "Skipping .deb build for MIPS"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  create_release:
    needs: [prepare, build_and_package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: all_packages/*