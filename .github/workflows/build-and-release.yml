name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_tag: ${{ steps.get_version.outputs.is_tag }}
    steps:
      - name: Get Version from Tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER=${GITHUB_REF_NAME#v}
            IS_TAG="true"
          else
            VER=$(date +'%Y.%m.%d')
            IS_TAG="false"
          fi
          
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "Version: $VER, Is Tag: $IS_TAG"

  build_and_package:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [amd64, arm64, mipsel_24kc]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            g++ \
            g++-aarch64-linux-gnu \
            wget \
            xz-utils

      - name: Build and Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          OPENWRT_SDK_URL: ${{ vars.OPENWRT_SDK_URL }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          chmod +x deployments/*.sh

          # 1. Select compiler for architecture
          unset CXX
          unset CXXFLAGS
          unset FAKEDNS_LDFLAGS
          if [ "$ARCH" == "arm64" ]; then
            export CXX=aarch64-linux-gnu-g++
          fi
          if [ "$ARCH" == "mipsel_24kc" ]; then
            DEFAULT_OPENWRT_SDK_URL="https://downloads.openwrt.org/releases/22.03.5/targets/ramips/mt7621/openwrt-sdk-22.03.5-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz"
            if [ -z "${OPENWRT_SDK_URL:-}" ]; then
              OPENWRT_SDK_URL="$DEFAULT_OPENWRT_SDK_URL"
              echo "::warning::OPENWRT_SDK_URL repository variable is not set."
              echo "::warning::Using default mt7621 SDK URL: $OPENWRT_SDK_URL"
            fi

            mkdir -p /tmp/openwrt-sdk
            wget -qO /tmp/openwrt-sdk.tar.xz "$OPENWRT_SDK_URL"
            tar -xf /tmp/openwrt-sdk.tar.xz -C /tmp/openwrt-sdk --strip-components=1

            TOOLCHAIN_BIN="$(find /tmp/openwrt-sdk/staging_dir -type d -path "*/toolchain-*/bin" | head -n1)"
            if [ -z "$TOOLCHAIN_BIN" ]; then
              echo "::error::OpenWrt SDK toolchain bin directory not found."
              exit 1
            fi

            export PATH="$TOOLCHAIN_BIN:$PATH"
            export CXX=mipsel-openwrt-linux-musl-g++
            export CXXFLAGS="-O2 -DNDEBUG -pipe -std=c++17 -pthread"
          fi
          command -v "${CXX:-g++}" || true
          "${CXX:-g++}" --version || true

          # 2. Build core binary
          ./deployments/build.sh $ARCH fakedns-lite

          # 3. OpenWrt IPK
          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "mipsel_24kc" ]; then
            ./deployments/package_core_ipk.sh $ARCH $VERSION
          fi

          # 4. Debian DEB
          if [ "$ARCH" == "arm64" ] || [ "$ARCH" == "amd64" ]; then
            ./deployments/package_full_deb.sh $ARCH $VERSION
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  create_release:
    needs: [prepare, build_and_package]
    # THIS IS THE KEY LINE: Only run if the trigger was a tag
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: all_packages/*
